# ─────────────────────────────────────────────────────────────────────────────
# DEPLOYMENT GATING — ACTION REQUIRED IN THE GITHUB UI
#
# Render auto-deploys this service from `main` on every push. Nothing in this
# file, and nothing in .github/workflows/ci.yml, can stop a deploy on its own:
# Render watches the branch, not the CI result. So a commit that fails the
# build or the tests still reaches production unless GitHub refuses the push
# or merge in the first place.
#
# Closing that gap is a MANUAL, ONE-TIME step in the GitHub repo settings
# (Settings → Branches → Add branch ruleset / protection rule for `main`):
#
#   1. Require a pull request before merging.
#   2. Require status checks to pass, and select all three CI jobs:
#        - "Lint, typecheck & shared tests"
#        - "Server tests (Postgres)"
#        - "Dependency audit"
#   3. Require branches to be up to date before merging.
#   4. Optionally, restrict who can push directly to `main`.
#
# Until that is switched on, CI reports pass/fail but blocks nothing.
#
# Belt and braces (also a dashboard action, in Render): set the service's
# Auto-Deploy to "After CI checks pass" if the plan offers it, or disable
# auto-deploy and deploy from the Render dashboard once CI is green.
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: campusride-server
    runtime: node
    # Change region to match your Neon database region for lowest latency.
    # Options: oregon, frankfurt, singapore, ohio, virginia
    region: oregon
    plan: free

    # Builds packages/shared first (apps/server needs its dist/ at runtime),
    # then builds apps/server (prisma generate + tsc).
    buildCommand: npm install && npm run build:server
    startCommand: npm run start --workspace=apps/server

    # Render polls this path to confirm the service is healthy.
    healthCheckPath: /health

    envVars:
      # ── Runtime (set values in Render dashboard — never commit secrets) ────

      - key: NODE_ENV
        value: production

      # Neon POOLED connection string. Must include pgbouncer=true and
      # connection_limit=5 (see DEPLOY.md for the exact format).
      # Set this in the Render dashboard → Environment tab.
      - key: DATABASE_URL
        sync: false

      # Neon DIRECT (non-pooled) connection string — used by Prisma for
      # migrations. Set this in the Render dashboard → Environment tab.
      - key: DIRECT_URL
        sync: false

      # Long random secret for JWT signing.
      # Generate with: openssl rand -hex 32
      - key: JWT_SECRET
        sync: false

      # Render injects PORT automatically — do not set this manually.
      # Listed here for visibility; the server reads process.env.PORT.
      # - key: PORT   (Render-injected, do not override)

      # ── Feature flags (safe defaults for first deploy) ──────────────────────

      # Moolre is gated by TWO independent flags (Phase 2). Payments stay off
      # for the cash-only launch; SMS is on so real login OTPs are texted.
      - key: MOOLRE_PAYMENTS_ENABLED
        value: "false"

      - key: MOOLRE_SMS_ENABLED
        value: "true"

      # Real SMS delivery for login OTPs. The server REFUSES TO BOOT if this
      # resolves to the dummy provider while NODE_ENV=production, so the
      # credentials below must be present for the service to come up.
      - key: OTP_PROVIDER
        value: moolre

      # ── Moolre credentials (set values in Render dashboard — never commit) ──

      # Moolre account/API user the SMS (VAS) and payment calls authenticate as.
      - key: MOOLRE_API_USER
        sync: false

      # X-API-VASKEY — required for SMS. Without it OTP delivery falls back to
      # the dummy provider, which now blocks production boot.
      - key: MOOLRE_VAS_KEY
        sync: false

      # Pre-registered, Moolre-approved SMS sender ID. Also required for SMS.
      - key: MOOLRE_SMS_SENDER_ID
        sync: false

      # Live SMS/payments host. Defaults to sandbox.moolre.com in code — set
      # this to https://api.moolre.com for production.
      - key: MOOLRE_BASE_URL
        sync: false

      # Payment-only credentials. Unused while MOOLRE_PAYMENTS_ENABLED=false;
      # listed so the payment phase is a dashboard change, not a redeploy.
      - key: MOOLRE_PUBLIC_KEY
        sync: false

      - key: MOOLRE_PRIVATE_KEY
        sync: false

      - key: MOOLRE_ACCOUNT_NUMBER
        sync: false

      - key: MOOLRE_WEBHOOK_SECRET
        sync: false

      # Never enable on production.
      - key: ENABLE_MOCK_DRIVER
        value: "false"

      # USSD channel kill-switch. Shelved for this launch: POST /ussd/callback
      # is unauthenticated and auto-provisions rider accounts from any phone
      # number, so it stays closed (404) until that path is hardened.
      - key: ENABLE_USSD
        value: "false"

      # ── Transport security (Phase 2) ───────────────────────────────────────

      # Comma-separated browser origins allowed to call the API (HTTP CORS and
      # Socket.io both use this list). IMPORTANT: when this is UNSET in
      # production the API now grants NO browser origin — it no longer
      # reflects whatever origin asked. The rider/driver apps are native and
      # send no Origin header, so they are unaffected; set this to the
      # showcase site's exact origin (e.g. https://campusride.example) before
      # expecting any browser client to work.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Legacy name for the same list, still honoured as a fallback.
      - key: DEMO_OTP_CORS_ORIGINS
        sync: false

      # Number of trusted proxy hops in front of the app. Render terminates
      # TLS at exactly one, so 1 is correct. Do NOT set this to "true" — that
      # trusts the whole X-Forwarded-For chain, letting any client spoof its
      # IP and bypass every per-IP rate limit. May also be an IP/CIDR list.
      - key: TRUST_PROXY
        value: "1"

      # ── Safety (Phase 4) ───────────────────────────────────────────────────

      # Public origin used to build the SOS ride-tracking link that is texted
      # to a rider's emergency contact. MUST be the externally-reachable URL
      # of this service — the recipient opens it on their own phone. If it is
      # unset the link falls back to http://localhost:PORT and the SOS arrives
      # pointing nowhere, which defeats the feature.
      # Set to this service's Render URL, e.g. https://campusride-server.onrender.com
      - key: PUBLIC_BASE_URL
        sync: false

      # Fixed number texted on EVERY SOS, in addition to the rider's own
      # emergency contact. This is the backstop that stops an SOS from a rider
      # who never saved a contact reaching nobody at all. Leave unset and the
      # SOS still works — it just won't reach support. Full SOS visibility is
      # a Phase 5 admin-panel item; this is the stopgap.
      - key: SUPPORT_CONTACT_PHONE
        sync: false

      # ── Cloudinary (signed driver-photo uploads) ───────────────────────────
      # The app no longer holds any Cloudinary credential: it requests a
      # short-lived signature from POST /uploads/driver-photo/signature.
      # CLOUDINARY_API_SECRET is the signing key and must never be exposed to
      # the apps or prefixed EXPO_PUBLIC_. Set all three in the dashboard.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false

      - key: CLOUDINARY_API_KEY
        sync: false

      - key: CLOUDINARY_API_SECRET
        sync: false
